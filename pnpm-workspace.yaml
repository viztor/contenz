packages:
  - "packages/*"

# Shared versions. `pnpm publish` / `pnpm pack` replace `catalog:` with these
# ranges in the published package.json (same as `workspace:`).
catalog:
  "@orama/orama": ^3.1.18
  "@orama/plugin-data-persistence": ^3.1.18
  "@stricli/auto-complete": ^1.3.0
  "@stricli/core": ^1.3.0
  "@types/node": ^26.4.1
  "@vitest/coverage-istanbul": ^4.1.11
  fast-glob: ^3.3.3
  husky: ^9.1.7
  knip: ^6.34.0
  lint-staged: ^17.4.1
  oxfmt: ^0.66.0
  oxlint: ^1.81.0
  oxlint-tsgolint: ^7.0.2001
  p-map: ^7.0.7
  picocolors: ^1.1.1
  tsup: ^8.5.1
  tsx: ^4.23.13
  turbo: ^2.10.12
  typescript: ^7.0.2
  ultracite: ^7.10.7
  vitest: ^4.1.11
  zod: ^4.5.4

catalogMode: prefer
minimumReleaseAge: 0

allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true
  "@parcel/watcher": true
  unrs-resolver: true
