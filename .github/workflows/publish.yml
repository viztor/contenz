name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        # version comes from package.json packageManager field
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
          # Do not set registry-url: setup-node would write
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and an empty
          # token blocks npm trusted publishing (OIDC).

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish packages
        run: pnpm run publish:all
        env:
          NPM_CONFIG_PROVENANCE: "true"
