name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        # version comes from package.json packageManager field
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prefer npm trusted publishing (OIDC). An empty NPM_TOKEN in ~/.npmrc
      # previously blocked the token exchange and 404'd unpublished packages.
      # Set repository secret NPM_TOKEN only as a fallback for packages that
      # are not yet configured as trusted publishers.
      - name: Publish packages
        run: pnpm run publish:all
        env:
          NPM_CONFIG_PROVENANCE: "true"
